# Checks that run automatically on every `git commit`.
# Install (once per clone):     uv run pre-commit install
# Run manually on all files:    uv run pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace        # remove whitespace at the end of lines
      - id: end-of-file-fixer          # every file ends with exactly one newline
      - id: check-yaml                 # .yaml files are valid (CI, k8s manifests)
      - id: check-toml                 # pyproject.toml is valid
      - id: check-merge-conflict       # no leftover <<<<<<< merge markers
      - id: check-added-large-files    # block files > 1MB (datasets, models)
        args: [--maxkb=1000]
      - id: detect-private-key         # block private keys (SSH/TLS)

  # Ruff: keep the same version as in uv.lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # uv: check that uv.lock is in sync with pyproject.toml
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock
