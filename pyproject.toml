[project]
name = "jobpilot"
version = "0.1.0"
description = "AI job-hunting copilot: LangGraph agent, FastAPI, Django, ML & LoRA fine-tuning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100        # Μέγιστο μήκος γραμμής (το default 88 είναι λίγο στενό)

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: βασικοί κανόνες στυλ (PEP 8)
    "F",       # Pyflakes: αχρησιμοποίητα imports/μεταβλητές, ορισμοί που λείπουν
    "I",       # isort: ταξινόμηση των imports
    "UP",      # pyupgrade: σύγχρονο συντακτικό Python 3.12
    "B",       # bugbear: συνηθισμένα "ύπουλα" bugs
    "SIM",     # simplify: απλούστερος τρόπος να γράψεις το ίδιο πράγμα
]
