name: CI

# When to run: on every push to main, and on every pull request
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code
permissions:
  contents: read

# If you push again while a run is in progress, cancel the old run.
# One group per workflow and per PR (or per branch for pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest

    # A throwaway Postgres for the tests, same image as docker-compose.yml.
    # The health check makes the job wait until the database is ready.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
          POSTGRES_DB: jobpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Settings that come from .env locally. CI-only values, not real secrets.
    env:
      SECRET_KEY: ci-only-insecure-key
      DATABASE_URL: postgresql://jobpilot:jobpilot@localhost:5432/jobpilot

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks (ruff, file checks, uv lock)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Fails if a model changed without a matching migration (--dry-run writes nothing)
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest
