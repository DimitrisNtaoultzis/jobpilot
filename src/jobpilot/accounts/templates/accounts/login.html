{% extends "base.html" %}

{% block title %}Log in · JobPilot{% endblock %}

{% block content %}
  <h1>Log in</h1>
  {# No action attribute: the form posts to the current URL, so ?next= is kept. #}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
  <p>No account? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
{% endblock %}
