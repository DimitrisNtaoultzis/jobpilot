# Curated learning resources for RAG: free resources for skills common in
# AI/ML engineering job postings.
#
# Rules:
# - Every URL must be opened and checked before it is added. Never add a URL from memory.
# - The URL is the unique key: ingestion upserts on it.
# - Title and description are what we embed ("{title}: {description}"), so the
#   description should name the topics a learner will find there.
# - After any edit, re-run the ingestion so the database matches this file.
#
# URLs last checked: 2026-11-17.

# --- Programming and software engineering -----------------------------------

[[resources]]
title = "The Python Tutorial"
url = "https://docs.python.org/3/tutorial/"
description = """
Official Python tutorial: data structures, control flow, functions, modules,
classes, exceptions, the standard library and virtual environments."""

[[resources]]
title = "Pro Git"
url = "https://git-scm.com/book/en/v2"
description = """
Free book on Git version control: commits, branching, merging, rebasing, remotes,
GitHub workflows and Git internals."""

[[resources]]
title = "pytest: Get Started"
url = "https://docs.pytest.org/en/stable/getting-started.html"
description = """
Getting started with pytest for Python testing: writing test functions,
assertions, expected exceptions, fixtures and running test suites."""

[[resources]]
title = "Pydantic Validation"
url = "https://pydantic.dev/docs/validation/latest/get-started/"
description = """
Pydantic documentation: data validation with Python type hints, models, fields,
validators, settings management and JSON schema."""

[[resources]]
title = "Learn the Linux Command Line"
url = "https://linuxcommand.org/"
description = """
Learn the Linux command line and the Bash shell: navigating the file system,
permissions, processes, pipes, redirection and writing shell scripts."""

[[resources]]
title = "MDN: Overview of HTTP"
url = "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview"
description = """
How HTTP works: clients and servers, requests and responses, methods, status
codes and headers. The foundation for building and consuming REST APIs."""

# --- Web frameworks and APIs -------------------------------------------------

[[resources]]
title = "FastAPI Tutorial - User Guide"
url = "https://fastapi.tiangolo.com/tutorial/"
description = """
Official FastAPI tutorial: building REST APIs in Python with path and query
parameters, request bodies with Pydantic, dependency injection, async endpoints,
security and testing."""

[[resources]]
title = "Writing your first Django app"
url = "https://docs.djangoproject.com/en/stable/intro/tutorial01/"
description = """
Official Django tutorial: building a web application with models, the ORM,
migrations, views, URL routing, templates, forms, the admin site and tests."""

# --- Data and databases ------------------------------------------------------

[[resources]]
title = "SQLBolt"
url = "https://sqlbolt.com/"
description = """
Interactive SQL lessons and exercises: SELECT queries, filtering, sorting,
JOINs, aggregates with GROUP BY, and creating and altering tables."""

[[resources]]
title = "PostgreSQL Tutorial"
url = "https://www.postgresql.org/docs/current/tutorial.html"
description = """
Official PostgreSQL tutorial: creating databases and tables, querying with SQL,
joins, aggregates, views, foreign keys, transactions and window functions."""

[[resources]]
title = "pgvector"
url = "https://github.com/pgvector/pgvector"
description = """
Vector similarity search for PostgreSQL: storing embeddings, cosine and L2
distance, HNSW and IVFFlat indexes for approximate nearest neighbor search."""

[[resources]]
title = "pandas: Getting started"
url = "https://pandas.pydata.org/docs/getting_started/index.html"
description = """
Getting started with pandas for data analysis in Python: DataFrames, reading CSV
files, selecting and filtering data, grouping, merging and plotting."""

[[resources]]
title = "NumPy: the absolute basics for beginners"
url = "https://numpy.org/doc/stable/user/absolute_beginners.html"
description = """
NumPy basics for numerical computing in Python: arrays, shapes, indexing,
broadcasting, vectorized operations and basic linear algebra."""

[[resources]]
title = "Apache Spark Quick Start"
url = "https://spark.apache.org/docs/latest/quick-start.html"
description = """
Quick start for Apache Spark big data processing with PySpark: DataFrames,
transformations and actions, caching and running distributed jobs."""

[[resources]]
title = "OpenIntro Statistics"
url = "https://www.openintro.org/book/os/"
description = """
Free statistics textbook: probability, distributions, hypothesis testing,
confidence intervals, inference and linear and logistic regression."""

