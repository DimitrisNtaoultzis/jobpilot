{% extends "base.html" %}

{% block title %}Add a CV · JobPilot{% endblock %}

{% block content %}
  <h1>Add a CV</h1>
  {# multipart/form-data: without it the browser sends only the file name, not its content. #}
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <p><a href="{% url 'jobs:cv_list' %}">Back to my CVs</a></p>
{% endblock %}
